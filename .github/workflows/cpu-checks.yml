name: CPU reproducibility checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cpu.txt
      - name: Assert CPU runtime and record versions
        run: |
          python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
          python -m pip freeze
      - name: Source checks and numerical provenance
        run: python scripts/verify_snapshot.py
      - name: Synthetic regression tests
        run: python scripts/run_release_tests.py
      - name: Terminal scoring and release gate
        run: python scripts/validate_release_artifacts.py
      - name: CLI help and summary reproduction
        run: |
          python scripts/verify_cli_help.py
          python scripts/reproduce_summaries.py --output reproduced-ci
      - name: Fresh checkout remains clean
        run: test -z "$(git status --porcelain)"
