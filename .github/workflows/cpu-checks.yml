name: CPU reproducibility checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CUDA_VISIBLE_DEVICES: ""
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6, Node 24
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cpu.txt
      - name: Assert CPU runtime and record versions
        run: |
          python -c "import torch; assert torch.version.cuda is None; print(torch.__version__)"
          python -m pip freeze
      - name: Source checks and numerical provenance
        run: python scripts/verify_snapshot.py
      - name: Synthetic regression tests
        run: python scripts/run_release_tests.py
      - name: Terminal scoring and release gate
        run: python scripts/validate_release_artifacts.py
      - name: CLI help and summary reproduction
        run: |
          python scripts/verify_cli_help.py
          python scripts/reproduce_summaries.py --output reproduced-ci
          python scripts/review_diagnostics.py --output reproduced-ci/review_diagnostics.json
          python scripts/build_review_figures.py --output reproduced-ci/figures
      - name: Fresh checkout remains clean
        run: test -z "$(git status --porcelain)"
